{{- if .Values.rustfs.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "simple-iot.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: {{ .Release.Name }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rustfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rustfs
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          env:
            - name: RUSTFS_ACCESS_KEY
              value: {{ .Values.rustfs.accessKey | quote }}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: S3_SECRET_ACCESS_KEY
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rustfs.storage }}
        {{- if .Values.rustfs.storageClass }}
        storageClassName: {{ .Values.rustfs.storageClass }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
spec:
  selector:
    app.kubernetes.io/component: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 9000
{{- end -}}
