{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    {{- include "simple-iot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  INFLUXDB_TOKEN: {{ .Values.influxdb.token | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.rustfs.secretKey | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-server-config
  labels:
    {{- include "simple-iot.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Release.Name }}-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: {{ .Values.postgres.user | quote }}
  DATABASE: {{ .Values.postgres.database | quote }}
  INFLUXDB_URL: http://{{ .Release.Name }}-influxdb:8181
  INFLUXDB_DATABASE: {{ .Values.influxdb.database | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.rustfs.accessKey | quote }}
  S3_BUCKET_NAME: {{ .Values.rustfs.bucket | quote }}
  S3_REGION: us-east-1
  S3_ENDPOINT: http://{{ .Release.Name }}-rustfs:9000
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  SIMPLE_IOT_DEMO_SEED_ENABLED: {{ .Values.server.demoSeed | quote }}
  SIMPLE_IOT_DEMO_PUBLISHER_ENABLED: {{ .Values.server.demoSeed | quote }}
  SIMPLE_IOT_DEMO_PUBLISHER_INTERVAL_MS: "15000"
{{- end -}}
