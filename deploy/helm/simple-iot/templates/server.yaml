apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "simple-iot.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: iot-server
          image: {{ include "simple-iot.image" (dict "image" .Values.server.image "registry" .Values.global.imageRegistry) }}
          env:
            - name: JDK_JAVA_OPTIONS
              value: {{ .Values.server.javaOpts | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: POSTGRES_PASSWORD
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: INFLUXDB_TOKEN
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: S3_SECRET_ACCESS_KEY
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-server-config
          ports:
            - name: api
              containerPort: {{ .Values.server.apiPort }}
            - name: mqtt
              containerPort: {{ .Values.server.mqttPort }}
            - name: mqtt-ws
              containerPort: {{ .Values.server.mqttWsPort }}
          readinessProbe:
            httpGet:
              path: /iot/actuator/health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
spec:
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.server.apiPort }}
    - name: mqtt
      port: {{ .Values.server.mqttPort }}
    - name: mqtt-ws
      port: {{ .Values.server.mqttWsPort }}
